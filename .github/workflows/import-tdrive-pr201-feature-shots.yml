name: Import PR 201 feature screenshots

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-tdrive-pr201-feature-shots.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout screenshot branch
        uses: actions/checkout@v4
        with:
          ref: tdrive-pr1-ci-screenshots
          fetch-depth: 0

      - name: Download PR feature screenshots
        shell: bash
        run: |
          set -euo pipefail
          dir=TDrive-PR-201-Path-Bar-Feature/images
          mkdir -p "$dir"
          base=https://raw.githubusercontent.com/silicon-valley-mafia/TDrive/ci/pr201-frontend/frontend/pr201-shots
          for name in \
            dark-1-hover-edit-button.png dark-1-hover-edit-button-header.png \
            dark-2-field-open.png dark-2-field-open-header.png \
            dark-3-not-found.png dark-3-not-found-header.png \
            dark-4-local-path.png dark-4-local-path-header.png \
            dark-5-file-selected.png dark-5-file-selected-header.png \
            light-1-hover-edit-button.png light-1-hover-edit-button-header.png \
            light-2-field-open.png light-2-field-open-header.png \
            light-3-not-found.png light-3-not-found-header.png \
            light-4-local-path.png light-4-local-path-header.png \
            light-5-file-selected.png light-5-file-selected-header.png; do
            curl --fail --silent --show-error --location "$base/$name" --output "$dir/$name"
            test -s "$dir/$name"
          done
          echo "Downloaded $(find "$dir" -type f -name '*.png' | wc -l) feature screenshots."

      - name: Generate gallery
        shell: bash
        run: |
          set -euo pipefail
          folder=TDrive-PR-201-Path-Bar-Feature
          raw=https://raw.githubusercontent.com/silicon-valley-mafia/public-shed-1/tdrive-pr1-ci-screenshots/$folder/images
          {
            echo '# TDrive PR #201 — Editable folder path bar'
            echo
            echo 'Feature screenshots for [PR #201](https://github.com/jeetrex17/TDrive/pull/201), not general CI regression captures.'
            echo
            echo 'The images show the edit affordance, path input, invalid-path feedback, local-path warning, and file-selected state in dark and light themes.'
            echo
            for file in "$folder"/images/*.png; do
              name="${file##*/}"
              echo "## $name"
              echo
              echo "![${name}](${raw}/${name})"
              echo
            done
          } > "$folder/GALLERY.md"
          cat > "$folder/README.md" <<'EOF'
# TDrive PR #201 — Editable folder path bar

Feature-specific screenshots of the editable breadcrumb/path bar.

- [Open the embedded gallery](GALLERY.md)
- [Source PR #201](https://github.com/jeetrex17/TDrive/pull/201)
- The original PNGs are retained in `images/`.
EOF

      - name: Commit images and gallery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TDrive-PR-201-Path-Bar-Feature
          git commit -m 'Import TDrive PR 201 path bar feature screenshots' || exit 0
          git push origin HEAD:tdrive-pr1-ci-screenshots
