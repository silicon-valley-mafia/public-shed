name: Import TDrive PR #1 CI screenshots

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches:
      - main
      - tdrive-pr1-ci-screenshots
    paths:
      - .github/workflows/import-tdrive-pr1-screenshots.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: import-tdrive-pr1-screenshots
  cancel-in-progress: false

jobs:
  import-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout screenshot branch
        uses: actions/checkout@v4
        with:
          ref: tdrive-pr1-ci-screenshots
          fetch-depth: 0

      - name: Skip if originals are already imported
        id: already
        run: |
          if [ -d TDrive-PR-1-CI-Screenshots/originals ] && [ "$(find TDrive-PR-1-CI-Screenshots/originals -type f | wc -l)" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download source workflow artifacts
        if: steps.already.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tdrive-artifacts
          gh api repos/silicon-valley-mafia/TDrive/actions/artifacts/14939122064/zip > /tmp/tdrive-artifacts/playwright.zip
          gh api repos/silicon-valley-mafia/TDrive/actions/artifacts/14949580751/zip > /tmp/tdrive-artifacts/appimage.zip
          test -s /tmp/tdrive-artifacts/playwright.zip
          test -s /tmp/tdrive-artifacts/appimage.zip
          unzip -tq /tmp/tdrive-artifacts/playwright.zip
          unzip -tq /tmp/tdrive-artifacts/appimage.zip

      - name: Extract and copy all image files into repository
        if: steps.already.outputs.skip != 'true'
        run: |
          set -euo pipefail
          DEST="TDrive-PR-1-CI-Screenshots/originals"
          mkdir -p /tmp/tdrive-artifacts/playwright /tmp/tdrive-artifacts/appimage "$DEST"
          unzip -oq /tmp/tdrive-artifacts/playwright.zip -d /tmp/tdrive-artifacts/playwright
          unzip -oq /tmp/tdrive-artifacts/appimage.zip -d /tmp/tdrive-artifacts/appimage
          find /tmp/tdrive-artifacts/playwright -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.gif' -o -iname '*.bmp' -o -iname '*.xwd' \) -print0 |
            while IFS= read -r -d '' file; do
              rel="${file#/tmp/tdrive-artifacts/playwright/}"
              mkdir -p "$DEST/playwright/$(dirname "$rel")"
              cp -f "$file" "$DEST/playwright/$rel"
            done
          find /tmp/tdrive-artifacts/appimage -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.gif' -o -iname '*.bmp' -o -iname '*.xwd' \) -print0 |
            while IFS= read -r -d '' file; do
              rel="${file#/tmp/tdrive-artifacts/appimage/}"
              mkdir -p "$DEST/appimage/$(dirname "$rel")"
              cp -f "$file" "$DEST/appimage/$rel"
            done
          count=$(find "$DEST" -type f | wc -l)
          test "$count" -gt 0
          cat > TDrive-PR-1-CI-Screenshots/IMPORT-MANIFEST.md <<EOF
          # TDrive PR #1 screenshot import

          Imported automatically from GitHub Actions artifacts on $(date -u +'%Y-%m-%d %H:%M UTC').

          - Playwright artifact ID: 14939122064
          - AppImage artifact ID: 14949580751
          - Imported image files: $count

          Originals are under `originals/playwright/` and `originals/appimage/`.
          EOF
          python - <<'PY'
          from pathlib import Path
          root = Path("TDrive-PR-1-CI-Screenshots")
          exts = {".png", ".jpg", ".jpeg", ".webp", ".gif", ".bmp"}
          files = sorted(p for p in (root / "originals").rglob("*") if p.is_file() and p.suffix.lower() in exts)
          with (root / "GALLERY.md").open("w", encoding="utf-8") as out:
              out.write("# TDrive PR #1 — full CI screenshot gallery\\n\\n")
              out.write(f"Imported {len(files)} viewable images from the CI artifacts.\\n\\n")
              for p in files:
                  rel = p.relative_to(root).as_posix()
                  out.write(f"### {p.name}\\n\\n![{p.name}]({rel})\\n\\n")
          PY

      - name: Commit imported originals and gallery
        if: steps.already.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TDrive-PR-1-CI-Screenshots/originals TDrive-PR-1-CI-Screenshots/IMPORT-MANIFEST.md TDrive-PR-1-CI-Screenshots/GALLERY.md
          if git diff --cached --quiet; then
            echo "No new screenshot files to commit."
            exit 0
          fi
          git commit -m "Import original TDrive PR #1 CI screenshots"
          git push origin tdrive-pr1-ci-screenshots

  import-pr201-feature-shots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout screenshot branch
        uses: actions/checkout@v4
        with:
          ref: tdrive-pr1-ci-screenshots
          fetch-depth: 0

      - name: Download PR 201 feature screenshots
        shell: bash
        run: |
          set -euo pipefail
          folder="TDrive-PR-201-Path-Bar-Feature"
          dest="$folder/images"
          mkdir -p "$dest"
          api="https://api.github.com/repos/silicon-valley-mafia/TDrive/contents/frontend/pr201-shots?ref=ci%2Fpr201-frontend"
          curl -fsSL "$api" -H "Accept: application/vnd.github+json" > /tmp/pr201-images.json
          jq -r '.[] | select(.type == "file" and (.name | test("^(dark|light)-.*\\.png$"))) | .download_url' /tmp/pr201-images.json > /tmp/pr201-image-urls.txt
          test -s /tmp/pr201-image-urls.txt
          while IFS= read -r url; do
            name="${url##*/}"
            curl -fsSL "$url" -o "$dest/$name"
          done < /tmp/pr201-image-urls.txt
          count="$(find "$dest" -maxdepth 1 -type f -name '*.png' | wc -l)"
          test "$count" -gt 0
          echo "Imported $count PR feature screenshots."

      - name: Generate feature gallery
        shell: bash
        run: |
          set -euo pipefail
          folder="TDrive-PR-201-Path-Bar-Feature"
          raw="https://raw.githubusercontent.com/silicon-valley-mafia/public-shed-1/tdrive-pr1-ci-screenshots/$folder/images"
          {
            echo "# TDrive PR #201 — Editable path bar"
            echo
            echo "Feature-specific screenshots for [PR #201](https://github.com/jeetrex17/TDrive/pull/201), not general CI regression captures."
            echo
            echo "Demonstrates the breadcrumb edit affordance, open path field, not-found feedback, local-path warning, and file selection in dark and light themes."
            echo
            for file in "$folder"/images/*.png; do
              name="${file##*/}"
              echo "## $name"
              echo
              echo "![$name]($raw/$name)"
              echo
            done
          } > "$folder/GALLERY.md"
          cat > "$folder/README.md" <<'EOF'
# TDrive PR #201 — Path Bar Feature

Feature screenshots for the editable breadcrumb/path bar.

- [Gallery](GALLERY.md)
- [Source PR](https://github.com/jeetrex17/TDrive/pull/201)
- Original PNGs are preserved in images/, imported from frontend/pr201-shots on branch ci/pr201-frontend.
EOF

      - name: Commit feature screenshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TDrive-PR-201-Path-Bar-Feature
          if git diff --cached --quiet; then
            echo "No feature screenshot changes."
            exit 0
          fi
          git commit -m "Import TDrive PR 201 path bar feature screenshots"
          git push origin tdrive-pr1-ci-screenshots
