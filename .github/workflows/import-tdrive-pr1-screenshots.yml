name: Import TDrive PR #1 CI screenshots

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-tdrive-pr1-screenshots.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: import-tdrive-pr1-screenshots
  cancel-in-progress: false

jobs:
  import-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Skip if originals are already imported
        id: already
        run: |
          if [ -d silicon-valley-mafia/TDrive/PRs/1/CI-Screenshots/originals ] && [ "$(find silicon-valley-mafia/TDrive/PRs/1/CI-Screenshots/originals -type f | wc -l)" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download source workflow artifacts
        if: steps.already.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tdrive-artifacts
          gh api repos/silicon-valley-mafia/TDrive/actions/artifacts/14939122064/zip > /tmp/tdrive-artifacts/playwright.zip
          gh api repos/silicon-valley-mafia/TDrive/actions/artifacts/14949580751/zip > /tmp/tdrive-artifacts/appimage.zip
          test -s /tmp/tdrive-artifacts/playwright.zip
          test -s /tmp/tdrive-artifacts/appimage.zip
          unzip -tq /tmp/tdrive-artifacts/playwright.zip
          unzip -tq /tmp/tdrive-artifacts/appimage.zip
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Extract and copy all image files into repository
        if: steps.already.outputs.skip != 'true'
        run: |
          set -euo pipefail
          DEST="silicon-valley-mafia/TDrive/PRs/1/CI-Screenshots/originals"
          mkdir -p /tmp/tdrive-artifacts/playwright /tmp/tdrive-artifacts/appimage "$DEST"
          unzip -oq /tmp/tdrive-artifacts/playwright.zip -d /tmp/tdrive-artifacts/playwright
          unzip -oq /tmp/tdrive-artifacts/appimage.zip -d /tmp/tdrive-artifacts/appimage
          find /tmp/tdrive-artifacts/playwright -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.gif' -o -iname '*.bmp' -o -iname '*.xwd' \) -print0 |
            while IFS= read -r -d '' file; do
              rel="${file#/tmp/tdrive-artifacts/playwright/}"
              mkdir -p "$DEST/playwright/$(dirname "$rel")"
              cp -f "$file" "$DEST/playwright/$rel"
            done
          find /tmp/tdrive-artifacts/appimage -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.gif' -o -iname '*.bmp' -o -iname '*.xwd' \) -print0 |
            while IFS= read -r -d '' file; do
              rel="${file#/tmp/tdrive-artifacts/appimage/}"
              mkdir -p "$DEST/appimage/$(dirname "$rel")"
              cp -f "$file" "$DEST/appimage/$rel"
            done
          # Convert the original XWD capture for inline display while retaining it unchanged.
          sudo apt-get update
          sudo apt-get install -y imagemagick
          if [ -f "$DEST/appimage/window.xwd" ]; then
            convert "$DEST/appimage/window.xwd" "$DEST/appimage/window.png"
          fi
          count=$(find "$DEST" -type f | wc -l)
          test "$count" -gt 0
          cat > silicon-valley-mafia/TDrive/PRs/1/CI-Screenshots/IMPORT-MANIFEST.md <<EOF
          # TDrive PR #1 screenshot import

          Imported automatically from GitHub Actions artifacts on $(date -u +'%Y-%m-%d %H:%M UTC').

          - Playwright artifact ID: 14939122064
          - AppImage artifact ID: 14949580751
          - Imported image files: $count

          Originals are under `originals/playwright/` and `originals/appimage/`.
          EOF
          python - <<'PY'
          from pathlib import Path
          root = Path("silicon-valley-mafia/TDrive/PRs/1/CI-Screenshots")
          exts = {".png", ".jpg", ".jpeg", ".webp", ".gif", ".bmp"}
          files = sorted(p for p in (root / "originals").rglob("*") if p.is_file() and p.suffix.lower() in exts)
          with (root / "GALLERY.md").open("w", encoding="utf-8") as out:
              out.write("# TDrive PR #1 — full CI screenshot gallery\\n\\n")
              out.write(f"Imported {len(files)} viewable images from the CI artifacts.\\n\\n")
              for p in files:
                  rel = p.relative_to(root).as_posix()
                  out.write(f"### {p.name}\\n\\n![{p.name}]({rel})\\n\\n")
          PY

      - name: Commit imported originals and gallery
        if: steps.already.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add silicon-valley-mafia/TDrive/PRs/1/CI-Screenshots/originals silicon-valley-mafia/TDrive/PRs/1/CI-Screenshots/IMPORT-MANIFEST.md silicon-valley-mafia/TDrive/PRs/1/CI-Screenshots/GALLERY.md
          if git diff --cached --quiet; then
            echo "No new screenshot files to commit."
            exit 0
          fi
          git commit -m "Import original TDrive PR #1 CI screenshots"
          git push origin main

