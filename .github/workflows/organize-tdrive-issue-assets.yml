name: Validate TDrive archive layout

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/organize-tdrive-issue-assets.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical archive paths and links
        shell: bash
        run: |
          set -euo pipefail
          test -d jeetrex17/TDrive/PRs/201/images
          test -f jeetrex17/TDrive/PRs/201/README.md
          test -f jeetrex17/TDrive/PRs/201/GALLERY.md
          test -d silicon-valley-mafia/TDrive/PRs/1/CI-Screenshots/originals
          test -f silicon-valley-mafia/TDrive/PRs/1/README.md
          test ! -e jeetrex17/TDrive/Issues/201
          test ! -e jeetrex17/TDrive/Issues/1
          ! grep -R -n 'tdrive-pr1-ci-screenshots' --include='*.md' --include='*.yml' .
          ! grep -R -n 'Issues/201\|Issues/1/CI-Screenshots' --include='*.md' --include='*.yml' .
          echo 'TDrive archive structure is consistent.'
